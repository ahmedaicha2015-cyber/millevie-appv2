<script>

const DEFAULT_CENTRES = [
  {nom:"CHU-MEL (Mère-Enfant Lagune)",ville:"Cotonou",tel:"+22921312345",urgence:"Maternité & Néonatologie 24h/24"},
  {nom:"CNHU-HKM Cotonou",ville:"Cotonou",tel:"+22921300155",urgence:"Urgences pédiatriques & adultes"},

  {nom:"CHD Zou-Collines (Abomey)",ville:"Abomey",tel:"+22922512345",urgence:"Pôle Mère-Enfant"},
  {nom:"CHD Atacora (Natitingou)",ville:"Natitingou",tel:"+22923821000",urgence:"Urgences & Maternité"}
];

const MENU_OBJECTIFS = {
  prep:{kcal:1800,protG:55},
  grossesse_T1:{kcal:1800,protG:60,ferMg:27,calciumMg:1000},
  grossesse_T2T3:{kcal:2200,protG:70,ferMg:27,calciumMg:1000},
  allaitement:{kcal:2500,protG:75,ferMg:30,calciumMg:1200},
  enfant_6_9m:{kcal:200,protG:6},
  enfant_9_12m:{kcal:300,protG:8},
  enfant_12_24m:{kcal:550,protG:15}
};

const MENU_SCHEMA = {
  matin:{part:0.30,categories:["Bouillies","Street food","Boissons"]},
  midi:{part:0.45,categories:["Plats complets","Féculents","Sauces"]},
  soir:{part:0.25,categories:["Soupes","Sauces","Féculents"]}
};

/* ============================================================
   2. ÉTAT + CHARGEMENT
   ============================================================ */
let RECIPES_DB = [];
let WHO_DATA = null;
let ACTIVITIES = [];
let QUIZ_ITEMS = [];
let DANGER_SIGNS = { femme:[], enfant:[] };

const STORAGE_KEY = 'millevie_v2';
let State = {
  lang:'fr', mode:'', lmp:'', dob:'', conceptionDate:'',
  name:'', childName:'', childSex:'m', commune:'Cotonou',
  pantry:['Maïs','Niébé (haricot)','Tomate','Huile de palme rouge (Zomi)','Oignon','Gingembre frais','Ail','Piment rouge'],
  measurements:[], vaccineRecords:{}, visitRecords:{}, userCenters:[], quizAnswers:{}
};
try { const s = localStorage.getItem(STORAGE_KEY); if (s) State = Object.assign(State, JSON.parse(s)); } catch(e){}
function persist(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(State)); }catch(e){} }

/* --- DÉCOMPRESSION DES 2 FORMATS DE RECETTES --- */
function expandRecipes(compact){
  return compact.map(a => ({
    id: a[0], nom: a[1], categorie: a[2], tempsMin: a[3],
    ageMinMois: a[4], contexteFemme: (a[5]||'').split(','),
    nutrition: { kcal: a[6], protG: a[7], ferMg: a[8], calciumMg: a[9] },
    ingredients: typeof a[10]==='string'
      ? a[10].split('|').map(x=>{const p=x.split(':');return{nom:p[0],qte:p[1]||''};})
      : (a[10]||[]).map(x=>({nom:x[0],qte:x[1]||''})),
    etapes: typeof a[11]==='string' ? a[11].split('|') : (a[11]||[]),
    securite: a[12] || '',
    source: a[13] || ''
  }));
}

async function boot(){
  try{
    const data = await (await fetch('data/recipes.json')).json();
    RECIPES_DB = data.format === 'compact-v1' ? expandRecipes(data.recipes) : data.recipes;
  }catch(e){ console.warn('recipes',e); }
  try{ WHO_DATA = await (await fetch('data/who_growth.json')).json(); }catch(e){ console.warn('who',e); }
  try{ ACTIVITIES = (await (await fetch('data/activities.json')).json()).activities; }catch(e){ console.warn('act',e); }
  try{ QUIZ_ITEMS = (await (await fetch('data/quiz.json')).json()).quiz; }catch(e){ console.warn('quiz',e); }
  try{ DANGER_SIGNS = await (await fetch('data/danger_signs.json')).json(); }catch(e){ console.warn('danger',e); }
  document.getElementById('lang-sel').value = State.lang;
  renderApp();
}

/* ============================================================
   3. UTILITAIRES
   ============================================================ */
const MS_DAY = 86400000;
const parseD = s => s ? new Date(s + 'T00:00:00') : new Date();
const diffDays = (a,b) => Math.round((b - a) / MS_DAY);
const addDays = (d,n) => new Date(d.getTime() + n*MS_DAY);
const formatD = d => d.toLocaleDateString(State.lang==='en'?'en-US':'fr-FR',{day:'numeric',month:'short',year:'numeric'});
const formatISO = d => d.toISOString().split('T')[0];
const todayISO = () => formatISO(new Date());

function speakText(txt){
  if(!('speechSynthesis' in window)) return alert("Audio non disponible.");
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = State.lang==='en' ? 'en-US' : 'fr-FR';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

/* CALCUL DU JOUR COURANT (J0 → J1000) */
function dateConception(){
  if(State.conceptionDate) return parseD(State.conceptionDate);
  if(State.mode==='preg' && State.lmp) return addDays(parseD(State.lmp), 14);
  if(State.mode==='child' && State.dob) return addDays(parseD(State.dob), -270);
  return null;
}
function jourCourant(){
  const c = dateConception();
  if(!c) return -1;
  return diffDays(c, new Date());
}
function contexteJour(j){
  if(j < 0) return 'prep';
  if(j <= 90) return 'grossesse_T1';
  if(j <= 270) return 'grossesse_T2T3';
  if(j <= 453) return 'allaitement';
  if(j <= 543) return 'enfant_6_9m';
  if(j <= 633) return 'enfant_9_12m';
  return 'enfant_12_24m';
}
function contexteLabel(ctx){
  return ({prep:"Préparation",grossesse_T1:"Grossesse T1",grossesse_T2T3:"Grossesse T2-T3",
    allaitement:"Allaitement (0-6 mois)",enfant_6_9m:"Bébé 6-9 mois",
    enfant_9_12m:"Bébé 9-12 mois",enfant_12_24m:"Enfant 12-24 mois"})[ctx] || ctx;
}

/* ============================================================
   4. MOTEUR DE MENUS
   ============================================================ */
function partPourContexte(rec, ctx){
  const map = {grossesse_T1:'femmeEnceinte',grossesse_T2T3:'femmeEnceinte',allaitement:'femmeAllaitante',
    enfant_6_9m:'enfant6_9m',enfant_9_12m:'enfant9_12m',enfant_12_24m:'enfant12_24m'};
  return (rec.part||{})[map[ctx]] || null;
}
function scoreIngredients(rec, pantry){
  if(!rec.ingredients||!rec.ingredients.length) return 0;
  const nom = rec.ingredients.map(i=>i.nom.toLowerCase());
  const p = (pantry||[]).map(x=>x.toLowerCase());
  let n = 0; nom.forEach(a=>{ if(p.some(b=>a.includes(b)||b.includes(a))) n++; });
  return n / nom.length;
}
function recipeAgeOk(rec, ctx){
  if(ctx.startsWith('enfant')){
    const m = ctx==='enfant_6_9m'?7 : ctx==='enfant_9_12m'?10 : 18;
    return (rec.ageMinMois||0) <= m;
  }
  return (rec.contexteFemme||[]).includes('grossesse') || (rec.contexteFemme||[]).includes('allaitement');
}
function proposeMenuJour(j){
  const ctx = contexteJour(j);
  const obj = MENU_OBJECTIFS[ctx] || MENU_OBJECTIFS.grossesse_T2T3;
  const slots = {};
  ['matin','midi','soir'].forEach((moment,mi) => {
    const sch = MENU_SCHEMA[moment];
    const cands = RECIPES_DB.filter(r => recipeAgeOk(r,ctx))
      .filter(r => sch.categories.includes(r.categorie) || r.categorie==='Sauces');
    const scored = cands.map(r => ({ r, s: scoreIngredients(r, State.pantry) + (sch.categories.includes(r.categorie)?0.5:0) }))
                        .sort((a,b)=> b.s-a.s);
    const pool = scored.slice(0, Math.max(5, Math.ceil(scored.length/3)));
    if(!pool.length){ slots[moment]=null; return; }
    const seed = Math.abs(j*7 + mi*13) % pool.length;
    const rec = pool[seed].r;
    slots[moment] = {
      recette:rec,
      part: partPourContexte(rec, ctx),
      kcalCible: Math.round(obj.kcal * sch.part),
      manquants: (rec.ingredients||[]).filter(i=>!State.pantry.some(p=>i.nom.toLowerCase().includes(p.toLowerCase()))).map(i=>i.nom)
    };
  });
  return { jour:j, contexte:ctx, objectif:obj, slots };
}
function bilanMenu(menu){
  let k=0,p=0;
  ['matin','midi','soir'].forEach(m=>{
    const s = menu.slots[m];
    if(s && s.recette.nutrition){ k+=s.recette.nutrition.kcal||0; p+=s.recette.nutrition.protG||0; }
  });
  return { kcal:Math.round(k), protG:Math.round(p), cible:menu.objectif };
}

/* ============================================================
   5. COURBE OMS (SVG)
   ============================================================ */
function svgGrowthChart(sexe, mesures, ageMoisActuel){
  if(!WHO_DATA) return '<p class="mu">Données OMS non chargées.</p>';
  const table = sexe==='f' ? WHO_DATA.girls_wfa : WHO_DATA.boys_wfa;
  const ages = Object.keys(table).map(Number).sort((a,b)=>a-b);
  const W=340,H=260,P={l:34,r:10,t:14,b:28};
  const xMax=24, yMax=18;
  const X = m => P.l + (m/xMax)*(W-P.l-P.r);
  const Y = kg => H - P.b - (kg/yMax)*(H-P.t-P.b);
  const line = (idx,color,w) => {
    const pts = ages.map(a=>`${X(a)},${Y(table[a][idx])}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${w}"/>`;
  };
  let grid = '';
  for(let i=0;i<=6;i++){ const a=i*4;
    grid+=`<line x1="${X(a)}" y1="${P.t}" x2="${X(a)}" y2="${H-P.b}" stroke="#e5e7e2"/>`;
    grid+=`<text x="${X(a)}" y="${H-P.b+14}" font-size="9" text-anchor="middle" fill="#57685e">${a}m</text>`;
  }
  for(let kg=0;kg<=yMax;kg+=3){
    grid+=`<line x1="${P.l}" y1="${Y(kg)}" x2="${W-P.r}" y2="${Y(kg)}" stroke="#e5e7e2"/>`;
    grid+=`<text x="${P.l-4}" y="${Y(kg)+3}" font-size="9" text-anchor="end" fill="#57685e">${kg}</text>`;
  }
  const pts = (mesures||[]).filter(m=>m.ageMois!=null && m.weight>0)
    .map(m=>`<circle cx="${X(m.ageMois)}" cy="${Y(m.weight)}" r="4" fill="#b83624" stroke="#fff" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" style="width:100%;height:auto">
    ${grid}
    ${line(0,'#b83624',1.5)} ${line(1,'#e8b23c',1.5)} ${line(2,'#1d5a3b',2.5)} ${line(3,'#e8b23c',1.5)} ${line(4,'#b83624',1.5)}
    <text x="${P.l+6}" y="${Y(table[24][0])-4}" font-size="9" fill="#b83624">-3 SD</text>
    <text x="${P.l+6}" y="${Y(table[24][2])-4}" font-size="9" fill="#1d5a3b" font-weight="bold">Médiane</text>
    <text x="${P.l+6}" y="${Y(table[24][4])+10}" font-size="9" fill="#b83624">+3 SD</text>
    ${pts}
    ${ageMoisActuel!=null?`<line x1="${X(ageMoisActuel)}" y1="${P.t}" x2="${X(ageMoisActuel)}" y2="${H-P.b}" stroke="#1d5a3b" stroke-dasharray="3,3"/>`:''}
  </svg>`;
}
function interpPoids(sexe, ageMois, poids){
  if(!WHO_DATA) return { zone:'?', message:'Données OMS non chargées', alert:'c' };
  const table = sexe==='f' ? WHO_DATA.girls_wfa : WHO_DATA.boys_wfa;
  const ages = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let ref = table[ages[0]];
  for(const a of ages){ if(a<=ageMois) ref = table[a]; }
  const [z3,z2,med,zp2,zp3] = ref;
  if(poids < z3) return { zone:'très sévère', message:'Poids sous -3 SD. Risque élevé — consultez immédiatement.', alert:'alert' };
  if(poids < z2) return { zone:'modérée', message:'Poids sous -2 SD. Croissance à surveiller.', alert:'warn' };
  if(poids > zp3) return { zone:'élevé', message:'Poids au-dessus de +3 SD. Vérifier avec pédiatre.', alert:'warn' };
  return { zone:'normal', message:'Poids dans les couloirs standards OMS 2006.', alert:'ok' };
}

      </div>`).join('')}
    </div>
    <div class="c"><h3>Ajouter un centre</h3>
      <input id="new_c_name" placeholder="Nom du centre">
      <input id="new_c_city" placeholder="Ville">
      <input id="new_c_tel" type="tel" placeholder="Téléphone">
      <button onclick="addCustomCenter()">Enregistrer</button>
    </div>`;
}

function saveProfileData(){
  const mode = document.getElementById('p_mode').value;
  const lmp = document.getElementById('p_lmp').value;
  const dob = document.getElementById('p_dob').value;
  const conception = document.getElementById('p_conception').value;
  const name = document.getElementById('p_name').value.trim();
  const cn = document.getElementById('p_cname').value.trim();
  const sex = document.getElementById('p_csex').value;
  const com = document.getElementById('p_commune').value.trim();

  if(mode==='preg' && !lmp && !conception){ alert('Indiquez la date des dernières règles OU la date de conception.'); return; }
  if(mode==='child' && !dob && !conception){ alert('Indiquez la date de naissance de votre enfant OU la date de conception.'); return; }

  State.mode = mode; State.lmp = lmp; State.dob = dob; State.conceptionDate = conception;
  State.name = name; State.childName = cn; State.childSex = sex; State.commune = com;
  persist();
  setTab('today');
}
function viewProfile(){
  return `<h2>👤 Mon Profil MILLEVIE</h2>
    <div class="c">
      <label>Ma situation :</label>
      <select id="p_mode">
        <option value="preg" ${State.mode==='preg'?'selected':''}>Je suis enceinte</option>
        <option value="child" ${State.mode==='child'?'selected':''}>J'ai un enfant de moins de 2 ans</option>
        <option value="prep" ${State.mode==='prep'?'selected':''}>Je prépare une grossesse</option>
      </select>

      <label>Mon prénom (facultatif)</label>
      <input id="p_name" value="${State.name||''}">

      <label>Date des dernières règles (DDR) si grossesse</label>
      <input type="date" id="p_lmp" value="${State.lmp||''}">

      <label>Date de naissance de l'enfant si déjà né</label>
      <input type="date" id="p_dob" value="${State.dob||''}">

      <label>Date de conception (optionnelle, précise)</label>
      <input type="date" id="p_conception" value="${State.conceptionDate||''}">
      <small class="mu">J0 = date de conception. Sans cette date, J0 sera estimé (DDR+14j ou naissance-270j).</small>

      <div class="row">
        <div><label>Prénom de l'enfant</label><input id="p_cname" value="${State.childName||''}"></div>
        <div><label>Sexe</label><select id="p_csex">
          <option value="m" ${State.childSex==='m'?'selected':''}>Garçon</option>
          <option value="f" ${State.childSex==='f'?'selected':''}>Fille</option>
        </select></div>
      </div>

      <label>Commune de résidence (Bénin)</label>
      <input id="p_commune" value="${State.commune||'Cotonou'}">

      <button style="width:100%;margin-top:10px" onclick="saveProfileData()">Enregistrer mon profil</button>
    </div>`;
}
