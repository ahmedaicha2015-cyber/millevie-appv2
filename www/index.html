<style>
/* ================================================================
   MILLEVIE DESIGN SYSTEM v4.0 PRO
   Architecture Modulaire & Performance Optimisée
   ================================================================ */
:root {
  /* Palette Principale */
  --vert: #1d5a3b;
  --vert-clair: #2b7850;
  --vert-pale: #dcece2;
  --ocre: #e8b23c;
  --ocre-pale: #fcf4e3;
  --ocre-fonce: #b8860b;
  --terra: #b83624;
  --terra-pale: #fce8e5;
  
  /* Neutres */
  --creme: #f7f9f6;
  --blanc: #ffffff;
  --txt: #17241d;
  --txt-mu: #6b7a70;
  --bord: #e6ece7;
  
  /* Ombres & Rayons */
  --ombre-sm: 0 2px 4px rgba(0,0,0,.04);
  --ombre: 0 8px 24px rgba(23,36,29,.08);
  --ombre-lg: 0 16px 40px rgba(23,36,29,.12);
  --r-sm: 12px;
  --r: 18px;
  --r-lg: 26px;
  
  /* Safe Areas */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --creme: #0d1410;
    --blanc: #18221c;
    --txt: #f0f5f1;
    --txt-mu: #9bb0a3;
    --bord: #2a3a30;
    --vert-pale: #21382a;
    --ocre-pale: #382f14;
    --terra-pale: #401f1a;
    --ombre-sm: 0 2px 4px rgba(0,0,0,.2);
    --ombre: 0 8px 24px rgba(0,0,0,.4);
    --ombre-lg: 0 16px 40px rgba(0,0,0,.6);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; font-family: 'Nunito', system-ui, sans-serif; background: var(--creme); color: var(--txt); overflow-x: hidden; }
body { padding-top: var(--safe-top); padding-bottom: calc(80px + var(--safe-bot)); }

/* --- ANIMATIONS --- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounceIn { 0% { transform: scale(.8); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
@keyframes pulseLogo { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.03); filter: brightness(1.1); } }
.anim-up { animation: slideUp .4s cubic-bezier(.22,1,.36,1) both; }
.anim-bounce { animation: bounceIn .5s ease-out both; }

/* --- SPLASH SCREEN --- */
#splash-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #1d5a3b 0%, #2b7850 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s ease, visibility 0.6s;
}
#splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.splash-logo-container { width: 160px; height: 160px; margin-bottom: 20px; animation: pulseLogo 2s infinite alternate; }
.loader-bar { width: 140px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
.loader-fill { height: 100%; width: 0%; background: var(--ocre); border-radius: 10px; transition: width 0.3s ease; }
.splash-text { color: white; font-size: 12px; margin-top: 15px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; font-weight: 700; }

/* --- HEADER GLASSMORPHISM --- */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(29, 90, 59, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #fff; padding: 12px 16px; padding-top: calc(12px + var(--safe-top));
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255,255,255,0.1);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo-svg { width: 36px; height: 36px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
.header-titles h1 { font-size: 18px; font-weight: 900; margin: 0; line-height: 1.1; letter-spacing: .5px; }
.header-titles small { display: block; font-size: 10px; opacity: .85; font-weight: 600; margin-top: 2px; }
.menu-btn { background: rgba(255,255,255,.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background .2s; }
.menu-btn:hover { background: rgba(255,255,255,.25); }

/* --- DROPDOWN MENU --- */
.dropdown {
  position: absolute; top: calc(100% + 8px); right: 16px;
  background: var(--blanc); border-radius: var(--r); box-shadow: var(--ombre-lg);
  min-width: 220px; overflow: hidden; z-index: 200; display: none; border: 1px solid var(--bord);
  transform-origin: top right; animation: slideDown .2s ease;
}
.dropdown.open { display: block; }
.dropdown button {
  display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none;
  color: var(--txt); padding: 14px 18px; text-align: left; font-weight: 700; font-size: 14px;
  cursor: pointer; min-height: auto; border-radius: 0; transition: all .15s;
}
.dropdown button:not(:last-child) { border-bottom: 1px solid var(--bord); }
.dropdown button:hover { background: var(--vert-pale); padding-left: 22px; }

/* --- MAIN CONTENT --- */
main { max-width: 720px; margin: auto; padding: 16px 16px 24px; }
h2 { font-size: 22px; font-weight: 900; margin: 20px 0 14px; color: var(--vert); letter-spacing: -.3px; }
h3 { font-size: 16px; font-weight: 800; margin: 0 0 8px; color: var(--txt); }
.mu { color: var(--txt-mu); font-size: 13px; line-height: 1.5; }
.lead { font-size: 14px; color: var(--txt-mu); margin: 6px 0 16px; }
.back-btn {
  display: inline-flex; align-items: center; gap: 8px; background: var(--blanc);
  border: 1.5px solid var(--bord); color: var(--vert); font-weight: 800; font-size: 13px;
  padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer; margin-bottom: 14px;
  min-height: auto; box-shadow: var(--ombre-sm); transition: all .2s;
}
.back-btn:active { transform: scale(.97); background: var(--vert-pale); }

/* --- CARDS & UI COMPONENTS --- */
.card {
  background: var(--blanc); border-radius: var(--r); padding: 18px; margin: 14px 0;
  box-shadow: var(--ombre); border: 1px solid var(--bord); position: relative; overflow: hidden;
  animation: slideUp .35s ease both;
}
.card-hero {
  background: linear-gradient(135deg, var(--vert) 0%, var(--vert-clair) 100%);
  color: #fff; border: none; box-shadow: var(--ombre-lg);
}
.card-hero::before { content: ""; position: absolute; top: -50%; right: -20%; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.06); }
.card-hero .big-num { font-size: 42px; font-weight: 900; line-height: 1; margin: 8px 0; letter-spacing: -1.5px; }
.card-hero small { color: rgba(255,255,255,.85); font-weight: 600; font-size: 12px; }
.card.warn { background: var(--ocre-pale); border-color: var(--ocre); border-left: 5px solid var(--ocre); }
.card.alert { background: var(--terra-pale); border-color: var(--terra); border-left: 5px solid var(--terra); }
.card.ok { background: var(--vert-pale); border-color: var(--vert); border-left: 5px solid var(--vert); }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--vert-pale); color: var(--vert); margin-right: 6px; margin-bottom: 4px; }
.tag.y { background: var(--ocre-pale); color: var(--ocre-fonce); }
.tag.r { background: var(--terra-pale); color: var(--terra); }

.btn {
  font: inherit; font-weight: 800; border: none; background: var(--vert); color: #fff;
  border-radius: var(--r-sm); padding: 12px 20px; min-height: 48px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
  transition: transform .15s, box-shadow .15s; box-shadow: 0 4px 12px rgba(29,90,59,.25);
}
.btn:active { transform: scale(.96); }
.btn.o { background: transparent; color: var(--vert); border: 1.5px solid var(--vert); box-shadow: none; }
.btn.d { background: var(--terra); box-shadow: 0 4px 12px rgba(184,54,36,.3); }
.btn.full { width: 100%; }
.btn.s { min-height: 36px; padding: 6px 12px; font-size: 12px; }

input, select, textarea {
  font: inherit; width: 100%; padding: 12px 14px; border: 1.5px solid var(--bord);
  border-radius: var(--r-sm); background: var(--blanc); color: var(--txt);
  min-height: 48px; margin: 6px 0 12px; font-size: 14px; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--vert); box-shadow: 0 0 0 3px var(--vert-pale); }
label { font-weight: 800; font-size: 12px; display: block; margin-top: 10px; color: var(--txt); }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > * { flex: 1; min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip {
  width: auto; flex: none; background: var(--blanc); color: var(--txt);
  border: 1.5px solid var(--bord); min-height: 36px; border-radius: 99px;
  padding: 4px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--ombre-sm); transition: all .15s;
}
.chip.on { background: var(--vert); color: #fff; border-color: var(--vert); }

/* --- GRID TILES --- */
.tiles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 18px 0; }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: var(--blanc); color: var(--txt); border: 1.5px solid var(--bord);
  border-radius: var(--r); padding: 16px 10px; font-size: 12px; min-height: 100px;
  font-weight: 800; cursor: pointer; text-align: center; box-shadow: var(--ombre-sm); transition: all .2s;
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--ombre); border-color: var(--vert); }
.tile-emoji { font-size: 32px; line-height: 1; }

/* --- SLOT CARD (Menu Jour) --- */
.slot-card {
  display: flex; gap: 12px; align-items: center; background: var(--blanc);
  border: 1.5px solid var(--bord); border-radius: var(--r); padding: 14px; margin: 10px 0;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.slot-card:active { transform: scale(.98); }
.slot-card.matin { border-left: 5px solid var(--ocre); }
.slot-card.midi { border-left: 5px solid var(--vert); }
.slot-card.soir { border-left: 5px solid var(--terra); }
.slot-emoji { width: 50px; height: 50px; flex-shrink: 0; background: var(--vert-pale); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.slot-content { flex: 1; min-width: 0; }
.slot-content h3 { font-size: 14px; margin: 0 0 4px; line-height: 1.3; font-weight: 800; }
.slot-meta { font-size: 11px; color: var(--txt-mu); font-weight: 600; }

/* --- BOTTOM NAVIGATION --- */
.bottom-nav {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-bot)); z-index: 90;
  background: rgba(255,255,255,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.3); border-radius: 24px; display: flex; padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.1); transition: transform .3s ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .bottom-nav { background: rgba(24,34,28,.9); border: 1px solid rgba(255,255,255,.05); }
}
.bottom-nav button {
  flex: 1; background: none; border: none; color: var(--txt-mu); border-radius: 16px;
  font-size: 9px; font-weight: 700; padding: 8px 4px; display: flex; flex-direction: column;
  align-items: center; gap: 4px; min-height: 50px; box-shadow: none; cursor: pointer; transition: all .3s ease;
}
.bottom-nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.5; transition: transform .3s ease; }
.bottom-nav button.on { color: var(--vert); background: var(--vert-pale); }
.bottom-nav button.on svg { transform: translateY(-2px); stroke-width: 3; }

/* --- TOAST NOTIFICATIONS --- */
.toast-container { position: fixed; bottom: calc(90px + var(--safe-bot)); left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none; }
.toast {
  background: var(--txt); color: var(--blanc); padding: 12px 20px; border-radius: 99px;
  font-weight: 700; font-size: 13px; box-shadow: var(--ombre-lg); margin-top: 8px;
  animation: slideUp .3s ease both; max-width: 90vw; display: flex; align-items: center; gap: 8px;
}
.toast.ok { background: var(--vert); }
.toast.err { background: var(--terra); }

/* --- CHART CONTAINER --- */
.chart-container { background: var(--blanc); border-radius: var(--r); padding: 16px; margin: 14px 0; border: 1px solid var(--bord); box-shadow: var(--ombre-sm); }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 11px; font-weight: 700; }
.chart-legend span { display: flex; align-items: center; gap: 6px; }
.chart-legend .dot { width: 10px; height: 10px; border-radius: 3px; }

/* --- FOOTER --- */
.app-footer { text-align: center; padding: 30px 20px 20px; color: var(--txt-mu); font-size: 11px; line-height: 1.8; margin-top: 30px; }
.app-footer strong { color: var(--vert); font-weight: 900; }

/* --- UTILITIES --- */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.divider { height: 1px; background: var(--bord); margin: 16px 0; }
.info-block { background: var(--creme); border-radius: var(--r-sm); padding: 12px; margin: 10px 0; border-left: 4px solid var(--ocre); }
.info-block.tip { border-left-color: var(--vert); background: var(--vert-pale); }
.info-block.warn { border-left-color: var(--terra); background: var(--terra-pale); }
.info-block h4 { margin: 0 0 6px; font-size: 13px; font-weight: 900; color: var(--vert); }
.info-block p { font-size: 12px; margin: 4px 0; line-height: 1.5; }
</style>
</head>

const MS_DAY = 86400000;
const parseD = s => s ? new Date(s+'T00:00:00') : new Date();
const diffDays = (a,b) => Math.round((b-a)/MS_DAY);
const addDays = (d,n) => new Date(d.getTime()+n*MS_DAY);
const todayISO = () => new Date().toISOString().split('T')[0];
const formatD = d => d.toLocaleDateString(State.lang==='fr'?'fr-FR':'en-US',{day:'numeric',month:'short',year:'numeric'});

function getCurrentChild() { return State.activeProfile==='child' && State.activeChildId ? State.children.find(c=>c.id===State.activeChildId) : null; }
function dateConception() {
  if(State.activeProfile==='preg') { if(State.conceptionDate) return parseD(State.conceptionDate); if(State.lmp) return addDays(parseD(State.lmp), 14); }
  else { const c=getCurrentChild(); if(c&&c.dob) return addDays(parseD(c.dob), -270); }
  return null;
}
function jourCourant() { const c=dateConception(); return c ? diffDays(c, new Date()) : -1; }
function contexteJour(j) {
  if(j<0)return 'prep'; if(j<=90)return 'grossesse_T1'; if(j<=270)return 'grossesse_T2T3'; 
  if(j<=453)return 'allaitement'; if(j<=543)return 'enfant_6_9m'; if(j<=633)return 'enfant_9_12m'; return 'enfant_12_24m';
}

// MOTEUR DE RECOMMANDATION MENU
function proposeMenuJour(j) {
  const ctx = contexteJour(j);
  const slots = {};
  ['matin','midi','soir'].forEach(m => {
    let candidates = RECIPES_DB.filter(r => recipeAgeOk(r, ctx));
    
    // Filtrage Catégorie Stratégique
    if(m==='matin') candidates = candidates.filter(r => ['Bouillies','Street food'].includes(r.cat));
    else if(m==='midi') candidates = candidates.filter(r => ['Plats complets','Sauces','Féculents'].includes(r.cat));
    else if(m==='soir') candidates = candidates.filter(r => ['Soupes','Sauces','Plats complets'].includes(r.cat));

    // Fallback Large si vide
    if(candidates.length === 0) candidates = RECIPES_DB.filter(r => recipeAgeOk(r, ctx));
    
    // Score Pantry (Priorité ingrédients dispo)
    candidates.sort((a,b) => scoreIngredients(b, State.pantry) - scoreIngredients(a, State.pantry));
    
    slots[m] = candidates[0] || null;
  });
  return { jour:j, contexte:ctx, slots };
}

function recipeAgeOk(rec, ctx) {
  if(ctx.startsWith('enfant')) {
    const monthsNeeded = ctx==='enfant_6_9m'?7 : ctx==='enfant_9_12m'?10 : 18;
    return rec.age <= monthsNeeded;
  }
  return rec.ctx.includes('grossesse') || rec.ctx.includes('allaitement');
}
function scoreIngredients(rec, pantry) {
  if(!rec.ing?.length) return 0;
  const names = rec.ing.map(i=>i.toLowerCase());
  const p = pantry.map(x=>x.toLowerCase());
  let matches = 0;
  names.forEach(n => { if(p.some(pp => n.includes(pp) || pp.includes(n))) matches++; });
  return matches / names.length;
}

function ViewGrow() {
  const child = getCurrentChild();
  if(!child) return `<button class="btn full" onclick="setTab('profile')">Ajouter un enfant</button>`;
  
  const ca = Math.round(diffDays(parseD(child.dob), new Date())/30.4375);
  const mesures = State.measurements.filter(m => m.childId === child.id || !m.childId); // Compatibilité ancienne
  
  // Génération Graphique SVG Natif
  const W = 340, H = 240, P = {l:30,r:10,t:10,b:30};
  const X = m => P.l + (m/24)*(W-P.l-P.r);
  const Y = kg => H - P.b - (kg/18)*(H-P.t-P.b);
  
  const table = child.sex === 'f' ? WHO_WFA_GIRLS : WHO_WFA_BOYS;
  const ages = Object.keys(table).map(Number).sort((a,b)=>a-b);
  
  let pathMed = "", pathLow = "", pathHigh = "";
  ages.forEach((a,i) => {
    const cmd = i===0?"M":"L";
    pathMed += `${cmd}${X(a)},${Y(table[a][2])}`;
    pathLow += `${cmd}${X(a)},${Y(table[a][0])}`;
    pathHigh += `${cmd}${X(a)},${Y(table[a][4])}`;
  });
  
  const pts = mesures.map(m => `<circle cx="${X(Math.min(24,m.ageMois||ca))}" cy="${Y(m.weight)}" r="4" fill="#b83624" stroke="#fff" stroke-width="2"/>`).join('');
  
  return `
    <h2>Croissance (OMS)</h2>
    <div class="chart-container">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">

function askAI() {
  const input = document.getElementById('ai-input');
  const text = input.value.trim();
  if (!text) return;
  const container = document.getElementById('chat-container');
  container.innerHTML += `<div class="chat-msg user">${text.replace(/</g,'&lt;')}</div>`;
  input.value = '';
  container.scrollTop = container.scrollHeight;
  
  setTimeout(() => {
    const res = generateAIResponse(text);
    const actionsHtml = (res.actions && res.actions.length) ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${res.actions.map(a=>`<button class="chip" onclick="setTab('${a[1]}')">${a[0]}</button>`).join('')}</div>` : '';
    container.innerHTML += `<div class="chat-msg bot">${res.text.replace(/</g,'&lt;')}${actionsHtml}</div>`;
    container.scrollTop = container.scrollHeight;
  }, 500);
}

function normalize(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function generateAIResponse(raw) {
  const t = raw.toLowerCase();
  const n = normalize(raw);
  let best = null, bestScore = 0;
  for(const rule of AI_RULES) {
    let sc = 0;
    for(const k of rule.keywords) {
      const kn = normalize(k);
      if(n.includes(kn) || t.includes(k)) sc++;
    }
    if(sc > bestScore) { bestScore = sc; best = rule; }
  }
  if(best) return { text: best.response, actions: best.actions || [] };
  return { text: "Je n'ai pas de réponse précise. Essayez 'fièvre', 'allaitement', 'vaccin' ou 'sport'.", actions: [['🍲 Cuisiner','cook'],['🧸 Éveil','stim']] };
}

}

  // 2. Injection données internes critiques (Toujours présentes)

  DANGER_SIGNS = DANGER_SIGNS.femme.length ? DANGER_SIGNS : { femme:["Saignements","Convulsions"], enfant:["Refus boire","Fièvre"] };
  QUIZ_ITEMS = QUIZ_ITEMS.length ? QUIZ_ITEMS : [{q:"Test", vrai:true, exp:"Demo"}];
  ACTIVITES_EVEIL = ACTIVITES_EVEIL.length ? ACTIVITES_EVEIL : [];
  PROGRAMME_SPORT_T2 = PROGRAMME_SPORT_T2.length ? PROGRAMME_SPORT_T2 : [];
  AI_RULES = AI_RULES.length ? AI_RULES : [];
  
  updateProgress(70);

  // 3. Appliquer Traductions
  applyTranslations();
  
  // 4. Démarrer Interface
  renderNav();
  setTab('today');
  
  updateProgress(100);
  hideSplashScreen();
}

async function loadExternalDataSafe() {
  const safeFetch = async (url) => {
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.json();
    } catch (e) {
      console.warn(`Skip external: ${url}`, e.message);
      return null;
    }
  };

  // Essayer de charger vos JSON si présents, sinon on garde les internes
  const extRecipes = await Promise.all([
    safeFetch('data/recipes_1.json'),
    safeFetch('data/recipes_2.json')
  ]).then(results => results.flat().filter(Boolean));
  
  if(extRecipes.length > 0) {
    // Conversion format compact si nécessaire (adapté à votre structure existante)
    // Ici on suppose qu'ils sont déjà au bon format ou on merge intelligemment
    // Pour la robustesse, on préfère souvent les internes si le format externe est risqué
    console.log("Données externes détectées, fusion...");
    // Logique de merge optionnelle...
  }
  
  const extWho = await safeFetch('data/who_growth.json');
  if(extWho) WHO_DATA = extWho;
  
  const extDanger = await safeFetch('data/danger_signs.json');
  if(extDanger) DANGER_SIGNS = extDanger;
  
  const extQuiz = await safeFetch('data/quiz.json');
  if(extQuiz) QUIZ_ITEMS = extQuiz;
}

function updateProgress(percent) {
  const bar = document.getElementById('load-progress');
  if(bar) bar.style.width = percent + '%';
}

function hideSplashScreen() {
  setTimeout(() => {
    const splash = document.getElementById('splash-screen');
    if(splash) splash.classList.add('hidden');
  }, 600); // Délai court pour effet pro
}
