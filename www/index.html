<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MILLEVIE — 1000 jours Bénin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5a3b">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN SYSTEM PRO (v3.3) ============ */
:root{
  --vert:#1d5a3b; --vert-clair:#2b7850; --vert-pale:#dcece2;
  --ocre:#e8b23c; --ocre-pale:#fcf4e3; --ocre-fonce:#b8860b;
  --terra:#b83624; --terra-pale:#fce8e5;
  --creme:#f7f9f6; --blanc:#ffffff;
  --txt:#17241d; --txt-mu:#6b7a70; --bord:#e6ece7;
  --ombre-sm:0 2px 4px rgba(0,0,0,.04);
  --ombre:0 8px 24px rgba(23,36,29,.08);
  --ombre-lg:0 16px 40px rgba(23,36,29,.12);
  --r-sm:12px; --r:18px; --r-lg:26px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --creme:#0d1410; --blanc:#18221c; --txt:#f0f5f1; --txt-mu:#9bb0a3;
    --bord:#2a3a30; --vert-pale:#21382a; --ocre-pale:#382f14; --terra-pale:#401f1a;
    --ombre-sm:0 2px 4px rgba(0,0,0,.2); --ombre:0 8px 24px rgba(0,0,0,.4); --ombre-lg:0 16px 40px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--creme);color:var(--txt);font:16px/1.55 Nunito,system-ui,-apple-system,sans-serif;padding-top:var(--safe-top);padding-bottom:calc(80px + var(--safe-bot));overflow-x:hidden;}

/* Animations Avancées */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.anim-up{animation:slideUp .4s cubic-bezier(.22,1,.36,1) both}
.anim-bounce{animation:bounceIn .5s ease-out both}

/* SPLASH SCREEN PROFESSIONNELLE */
#splash-screen {position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #1d5a3b 0%, #2b7850 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease, visibility 0.8s;}
#splash-screen.hidden {opacity: 0; visibility: hidden; pointer-events: none;}
.splash-logo {width: 180px; height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3)); animation: pulseLogo 2s infinite alternate;}
@keyframes pulseLogo {0% {transform: scale(1);} 100% {transform: scale(1.05);}}
.splash-text {color: white; font-size: 14px; margin-top: 20px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.9;}
.loader-bar {width: 150px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; margin-top: 30px; overflow: hidden;}
.loader-fill {height: 100%; width: 0%; background: var(--ocre); border-radius: 10px; transition: width 0.3s ease;}

/* Header Glassmorphism */
.app-header {position: sticky; top: 0; z-index: 100; background: rgba(29, 90, 59, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; padding: 14px 18px; padding-top: calc(14px + var(--safe-top)); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(0,0,0,0.15);}
.header-left {display: flex; align-items: center; gap: 12px;}
.logo-svg {width: 42px; height: 42px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));}
.header-titles h1 {font-size: 20px; font-weight: 900; margin: 0; line-height: 1.1; letter-spacing: .5px;}
.header-titles small {display: block; font-size: 11px; opacity: .85; font-weight: 600; margin-top: 2px; letter-spacing: .3px;}
.menu-btn {background: rgba(255,255,255,.15); border: none; color: #fff; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; min-height: auto; padding: 0; transition: background 0.2s;}
.menu-btn:hover {background: rgba(255,255,255,.25);}

/* Dropdown Menu Moderne */
.dropdown {position: absolute; top: calc(100% + 8px); right: 18px; background: var(--blanc); border-radius: var(--r); box-shadow: var(--ombre-lg); min-width: 240px; overflow: hidden; z-index: 200; display: none; border: 1px solid var(--bord); transform-origin: top right; animation: slideDown .2s ease;}
.dropdown.open {display: block;}
.dropdown button {display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none; color: var(--txt); padding: 14px 18px; text-align: left; font-weight: 700; font-size: 15px; cursor: pointer; min-height: auto; border-radius: 0; transition: all 0.2s;}
.dropdown button:not(:last-child) {border-bottom: 1px solid var(--bord);}
.dropdown button:hover {background: var(--vert-pale); padding-left: 22px;}

/* Main Content Area */
main {max-width: 720px; margin: auto; padding: 16px 16px 24px;}
h2 {font-size: 24px; font-weight: 900; margin: 20px 0 14px; color: var(--vert); letter-spacing: -.3px;}
.card {background: var(--blanc); border-radius: var(--r); padding: 18px; margin: 14px 0; box-shadow: var(--ombre); border: 1px solid var(--bord); position: relative; overflow: hidden;}
.card-hero {background: linear-gradient(135deg, var(--vert) 0%, var(--vert-clair) 100%); color: #fff; border: none; box-shadow: var(--ombre-lg);}
.big-num {font-size: 48px; font-weight: 900; line-height: 1; margin: 8px 0; letter-spacing: -1.5px;}

/* Bottom Navigation Flottante */
.bottom-nav {position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-bot)); z-index: 90; background: rgba(255,255,255,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.3); border-radius: 24px; display: flex; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.1); transition: transform .3s ease;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottom-nav{background:rgba(24,34,28,.9);border:1px solid rgba(255,255,255,.05)}}
.bottom-nav button {flex: 1; background: none; border: none; color: var(--txt-mu); border-radius: 16px; font-size: 10px; font-weight: 700; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 50px; box-shadow: none; cursor: pointer; transition: all .3s ease;}
.bottom-nav button svg {width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; transition: transform .3s ease;}
.bottom-nav button.on {color: var(--vert); background: var(--vert-pale);}
.bottom-nav button.on svg {transform: translateY(-2px); stroke-width: 3;}

/* Composants UI Standards */
.btn {font: inherit; font-weight: 800; border: none; background: var(--vert); color: #fff; border-radius: var(--r-sm); padding: 13px 20px; min-height: 50px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; transition: transform .15s, box-shadow .15s; box-shadow: 0 4px 12px rgba(29,90,59,.25);}
.btn:active {transform: scale(.96);}
.btn.o {background: transparent; color: var(--vert); border: 1.5px solid var(--vert); box-shadow: none;}
.tag {display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 99px; background: var(--vert-pale); color: var(--vert); margin-right: 6px;}
.chip {width: auto; flex: none; background: var(--blanc); color: var(--txt); border: 1.5px solid var(--bord); min-height: 40px; border-radius: 99px; padding: 6px 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--ombre-sm); transition: all .15s;}
.chip.on {background: var(--vert); color: #fff; border-color: var(--vert);}

/* Grilles Tiles */
.tiles-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0;}
.tile {display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--blanc); color: var(--txt); border: 1.5px solid var(--bord); border-radius: var(--r); padding: 18px 12px; font-size: 13.5px; min-height: 110px; font-weight: 800; cursor: pointer; text-align: center; box-shadow: var(--ombre-sm); transition: all .2s;}
.tile:hover {transform: translateY(-3px); box-shadow: var(--ombre); border-color: var(--vert);}
.tile-emoji {font-size: 38px; line-height: 1;}

/* Slot Card (Menu Jour) */
.slot-card {display: flex; gap: 14px; align-items: flex-start; background: var(--blanc); border: 1.5px solid var(--bord); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--ombre-sm); cursor: pointer; transition: transform .15s, box-shadow .15s;}
.slot-card:hover {transform: translateX(5px); box-shadow: var(--ombre);}
.slot-card.matin {border-left: 5px solid var(--ocre);} 
.slot-card.midi {border-left: 5px solid var(--vert);} 
.slot-card.soir {border-left: 5px solid var(--terra);}
.slot-emoji {width: 68px; height: 68px; flex-shrink: 0; background: var(--vert-pale); border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 38px; line-height: 1;}
.slot-content {flex: 1; min-width: 0;}
.slot-content h3 {font-size: 15.5px; margin: 0 0 6px; line-height: 1.3;}

/* Chat IA */
.chat-msg {max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; animation: slideUp .3s ease; white-space: pre-wrap;}
.chat-msg.bot {background: var(--blanc); align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: var(--ombre-sm);}
.chat-msg.user {background: var(--vert); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: var(--ombre-sm);}

/* Toast Notifications */
.toast-container {position: fixed; bottom: calc(90px + var(--safe-bot)); left: 50%; transform: translateX(-50%); z-index: 1000; pointer-events: none;}
.toast {background: var(--txt); color: var(--blanc); padding: 14px 22px; border-radius: 99px; font-weight: 700; font-size: 14px; box-shadow: var(--ombre-lg); margin-top: 8px; animation: slideUp .3s ease both; max-width: 90vw; display: flex; align-items: center; gap: 10px;}
.toast.ok {background: var(--vert);} .toast.err {background: var(--terra);}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
  <svg class="splash-logo" viewBox="0 0 64 64"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c453"/><stop offset="1" stop-color="#e8b23c"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="#f6f8f5" opacity=".15"/><circle cx="32" cy="32" r="26" fill="url(#lg1)"/><circle cx="24" cy="24" r="7" fill="#1d5a3b"/><circle cx="40" cy="30" r="5.5" fill="#1d5a3b"/><path d="M16 50 Q24 38 32 50" fill="#1d5a3b"/><path d="M34 46 Q40 38 46 46" fill="#1d5a3b"/><circle cx="32" cy="15" r="3.5" fill="#b43a24"/></svg>
  <div class="loader-bar"><div class="loader-fill" id="load-progress"></div></div>
  <div class="splash-text">Chargement...</div>
</div>

<header class="app-header">
  <div class="header-left">
    <svg class="logo-svg" viewBox="0 0 64 64" aria-label="MILLEVIE"><defs><linearGradient id="lg1-h" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6c453"/><stop offset="1" stop-color="#e8b23c"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="#f6f8f5" opacity=".15"/><circle cx="32" cy="32" r="26" fill="url(#lg1-h)"/><circle cx="24" cy="24" r="7" fill="#1d5a3b"/><circle cx="40" cy="30" r="5.5" fill="#1d5a3b"/><path d="M16 50 Q24 38 32 50" fill="#1d5a3b"/><path d="M34 46 Q40 38 46 46" fill="#1d5a3b"/><circle cx="32" cy="15" r="3.5" fill="#b43a24"/></svg>
    <div class="header-titles"><h1>MILLEVIE</h1><small data-i18n="subtitle">1000 jours pour bien grandir</small></div>
  </div>
  <div class="header-right">
    <button class="menu-btn" onclick="toggleDropdown()" aria-label="Menu">⋯</button>
  </div>
  <div class="dropdown" id="dropdown">
    <button onclick="setTab('profile');closeDropdown()">👤 <span data-i18n="nav_profile">Mon profil</span></button>
    <button onclick="setTab('sport');closeDropdown()">🤰 <span data-i18n="nav_sport">Programme sport</span></button>
    <button onclick="setTab('catalogue');closeDropdown()">📚 <span data-i18n="nav_catalog">Catalogue recettes</span></button>
    <button onclick="toggleLang();closeDropdown()">🌍 <span data-i18n="nav_lang">Langue / Language</span></button>
    <button onclick="setTab('about');closeDropdown()">ℹ️ <span data-i18n="nav_about">À propos</span></button>
  </div>
</header>

<main id="m">
  <!-- Le contenu dynamique s'affiche ici -->
</main>

<nav class="bottom-nav" id="nav"></nav>
<div class="toast-container" id="toasts"></div>

<!-- CHARGEMENT DES SCRIPTS MODULAIRES -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
